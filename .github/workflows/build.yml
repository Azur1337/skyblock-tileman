name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25-ea'
          distribution: 'temurin'

      - name: Install MoulConfig fork
        uses: ./.github/actions/moulconfig-fork

      - name: Provide the Hypixel app key
        shell: bash
        env:
          HYPIXEL_API_KEY: ${{ secrets.HYPIXEL_API_KEY }}
        run: |
          # Secrets are withheld from PRs sent from forks, and this artifact is never
          # distributed to players, so a placeholder keeps those builds green.
          if [ -z "${HYPIXEL_API_KEY:-}" ]; then
            echo "::warning::HYPIXEL_API_KEY secret unavailable; building with a placeholder. This jar must not be released."
            echo 'TILEMAN_HYPIXEL_API_KEY=00000000-0000-0000-0000-000000000000' > .env
          else
            printf 'TILEMAN_HYPIXEL_API_KEY=%s\n' "$HYPIXEL_API_KEY" > .env
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          if-no-files-found: error
