name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v0.1.0-beta, etc.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25-ea'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Get mod version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Find Shadow JAR file
        id: find_jar
        run: |
          JAR_FILE=$(find build/libs -name "*-shadow.jar" | head -1)
          echo "JAR_PATH=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "JAR_NAME=$(basename $JAR_FILE)" >> $GITHUB_OUTPUT
          echo "Found JAR: $JAR_FILE"

      - name: Generate Changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            # No previous tag, get all commits
            COMMITS=$(git log --pretty=format:"%s" --no-merges)
          else
            # Get commits since previous tag
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"%s" --no-merges)
          fi
          
          # Build changelog sections
          FEATURES=""
          FIXES=""
          OTHER=""
          
          while IFS= read -r commit; do
            if [[ $commit == feat* ]]; then
              # Remove 'feat:' or 'feat(scope):' prefix
              MSG=$(echo "$commit" | sed 's/^feat[^:]*: //')
              FEATURES="$FEATURES\n- $MSG"
            elif [[ $commit == fix* ]]; then
              MSG=$(echo "$commit" | sed 's/^fix[^:]*: //')
              FIXES="$FIXES\n- $MSG"
            elif [[ ! $commit == chore* ]] && [[ ! $commit == ci* ]] && [[ ! $commit == docs* ]]; then
              OTHER="$OTHER\n- $commit"
            fi
          done <<< "$COMMITS"
          
          # Build final changelog
          CHANGELOG=""
          if [ -n "$FEATURES" ]; then
            CHANGELOG="## ✨ Features\n$FEATURES\n\n"
          fi
          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}## 🐛 Bug Fixes\n$FIXES\n\n"
          fi
          if [ -n "$OTHER" ]; then
            CHANGELOG="${CHANGELOG}## 📦 Other Changes\n$OTHER\n\n"
          fi
          
          # Write to file for the release action
          echo -e "$CHANGELOG" > CHANGELOG.md
          cat CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Skyblock Tileman v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          files: ${{ steps.find_jar.outputs.JAR_PATH }}
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
