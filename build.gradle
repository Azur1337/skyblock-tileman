plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.gradleup.shadow' version '9.4.2'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = 'NEU Maven'
		url = 'https://maven.notenoughupdates.org/releases/'
	}
}

loom {

	mods {
		"skyblocktileman" {
			sourceSet sourceSets.main
		}
	}

	accessWidenerPath = file("src/main/resources/moulconfig.accesswidener")
}

configurations {
	shadowModImpl
	modImplementation.extendsFrom(shadowModImpl)
	implementation.extendsFrom(shadowModImpl)
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// MoulConfig — SkyHanni-style config GUI (uses Kotlin internally)
	shadowModImpl "org.notenoughupdates.moulconfig:modern-26.2:4.7.2"
	shadowModImpl "org.jetbrains.kotlin:kotlin-stdlib:2.1.21"
}

shadowJar {
	configurations = [project.configurations.shadowModImpl]
	relocate 'io.github.notenoughupdates.moulconfig', 'com.azur.skyblocktileman.deps.moulconfig'
	archiveClassifier.set('shadow')

	mergeServiceFiles()
}

// Wire shadowJar into remapJar if Loom registers it (pre-26.x),
// otherwise just make 'build' depend on shadowJar directly (26.x unobfuscated).
afterEvaluate {
	def remapTask = tasks.findByName('remapJar')
	if (remapTask != null) {
		remapTask.dependsOn shadowJar
		remapTask.inputFile.set(shadowJar.archiveFile)
	} else {
		// No remap needed — ensure build produces the shadowed jar
		tasks.named('jar') {
			dependsOn shadowJar
			archiveClassifier.set('slim')
		}
		tasks.named('build') {
			dependsOn shadowJar
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
